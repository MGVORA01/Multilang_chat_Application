line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[lint.per-file-ignores]
"tests/integration/conftest.py" = ["E402"]  # must skip the module before importing the app when no DB is configured
"scripts/*" = ["E501"]  # long human-readable report lines in CLI scripts
