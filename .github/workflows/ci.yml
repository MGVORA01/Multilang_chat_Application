name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d chat_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values for the test run only (the mock translator needs no model download).
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/chat_test
      JWT_SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-Qx7vLm2pZr9sTk4wNb8yHc3dFg6jUe1a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Security lint
        run: pip install bandit && bandit -r app -q
      - name: Migrations match models
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Tests (unit + integration, mock translator)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
